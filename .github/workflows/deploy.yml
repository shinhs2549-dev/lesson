# PDF를 올리거나 지울 때마다 자동으로 자료 목록(files.json)을 새로 만들고 사이트에 반영합니다.
# 이 파일은 고칠 필요가 없습니다.
name: 수업 자료 목록 갱신

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 자료 목록 만들기
        run: |
          git config core.quotepath off
          python3 - <<'PY'
          import json, os, subprocess, datetime

          def last_date(path):
              r = subprocess.run(['git', 'log', '-1', '--format=%cI', '--', path],
                                 capture_output=True, text=True)
              return r.stdout.strip() or None

          subjects = []
          for d in sorted(os.listdir('.')):
              # 이름이 . 또는 _ 로 시작하는 폴더·파일은 목록에서 숨김 (예: _lib, _명단.enc.json)
              if d.startswith(('.', '_')) or not os.path.isdir(d):
                  continue
              files = []
              for cur, dirs, names in os.walk(d):
                  dirs[:] = sorted(x for x in dirs if not x.startswith(('.', '_')))
                  for n in sorted(names):
                      if n.startswith(('.', '_')) or not n.lower().endswith(('.pdf', '.html')):
                          continue
                      p = os.path.join(cur, n).replace(os.sep, '/')
                      g = os.path.relpath(cur, d).replace(os.sep, '/')
                      files.append({'path': p, 'name': n, 'group': '' if g == '.' else g,
                                    'size': os.path.getsize(p), 'date': last_date(p)})
              subjects.append({'name': d, 'files': files})

          out = {'generated': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                 'subjects': subjects}
          with open('files.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
