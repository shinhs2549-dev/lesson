<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이인승 수업 자료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f4f1ea;
  --paper:#fffdf8;
  --ink:#1d2a33;
  --ink-2:#55636d;
  --line:#e2ddd2;
  --accent:#1f6f5c;
  --accent-soft:#e3efe9;
  --new:#d9572b;
  --viewer:#15191c;
  --vbar:#20262a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- 목록 화면 ---------- */
.top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:36px 48px 20px;max-width:1500px;margin:0 auto;
}
.top h1{margin:0;font-size:clamp(28px,3.4vw,46px);font-weight:800;letter-spacing:-0.03em}
.top h1 span{color:var(--accent)}
.top .sub{margin:6px 0 0;color:var(--ink-2);font-size:17px}
.top-right{display:flex;align-items:center;gap:14px}
#clock{font-size:clamp(22px,2.4vw,34px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.ghost{
  padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--paper);
  font-size:17px;font-weight:600;color:var(--ink-2)
}
.ghost:active{transform:scale(.97)}

.tabs{display:flex;gap:10px;flex-wrap:wrap;padding:0 48px;max-width:1500px;margin:0 auto}
.tab{
  padding:14px 26px;border-radius:999px;font-size:21px;font-weight:700;
  background:var(--paper);border:2px solid var(--line);color:var(--ink-2)
}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .cnt{opacity:.6;font-weight:600;margin-left:6px;font-size:17px}

main{padding:28px 48px 64px;max-width:1500px;margin:0 auto}
.group-title{font-size:19px;font-weight:700;color:var(--ink-2);margin:26px 0 12px}
.group-title:first-child{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{
  display:flex;align-items:center;gap:18px;text-align:left;width:100%;
  padding:22px 22px;border-radius:18px;background:var(--paper);border:2px solid var(--line);
  transition:border-color .15s, transform .1s;
}
.card:hover{border-color:var(--accent)}
.card:active{transform:scale(.985)}
.badge{
  flex:0 0 auto;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums
}
.badge.doc{font-size:15px;letter-spacing:.04em}
.badge.tool{background:#fdeee3;color:#c4561f;font-size:30px}
.card.toolcard{border-color:#efd9c6}
.card.toolcard:hover{border-color:#c4561f}
.card .t{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-0.02em;word-break:keep-all}
.card .m{margin-top:6px;font-size:15px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.new{background:var(--new);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.empty{
  padding:56px 24px;text-align:center;color:var(--ink-2);font-size:19px;line-height:1.7;
  border:2px dashed var(--line);border-radius:18px;background:var(--paper)
}
.empty b{color:var(--ink)}

/* ---------- 뷰어 ---------- */
#viewer{position:fixed;inset:0;background:var(--viewer);display:flex;flex-direction:column;z-index:10}
#viewer[hidden]{display:none}
.vbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--vbar);color:#e9eef0;
}
.vbtn{
  height:52px;min-width:52px;padding:0 18px;border-radius:12px;background:#2f373c;
  font-size:19px;font-weight:700;color:#e9eef0;display:inline-flex;align-items:center;justify-content:center;gap:6px
}
.vbtn:active{background:#3d474d}
.vbtn.primary{background:var(--accent)}
.vtitle{flex:1 1 auto;min-width:0;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.vpage{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.vpage input{
  width:72px;height:52px;border-radius:12px;border:0;background:#2f373c;color:#fff;
  font:inherit;text-align:center;-moz-appearance:textfield
}
.vpage input::-webkit-inner-spin-button,.vpage input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.vgroup{display:flex;gap:6px}
.stage{flex:1 1 auto;position:relative;overflow:auto;display:flex;touch-action:pan-x pan-y}
#canvas{margin:auto;display:block;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.45)}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);width:76px;height:150px;border-radius:18px;
  background:rgba(40,48,53,.55);color:#fff;font-size:64px;line-height:1;font-weight:300;
  display:grid;place-items:center;z-index:2;
}
.nav:active{background:rgba(40,48,53,.85)}
.nav[disabled]{opacity:.15;pointer-events:none}
.nav.prev{left:12px}.nav.next{right:12px}
.vbody{flex:1 1 auto;position:relative;display:flex;min-height:0}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8dc;font-size:20px;pointer-events:none}
.loading[hidden]{display:none}
.toast{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  background:rgba(32,38,42,.96);color:#fff;padding:14px 16px 14px 22px;border-radius:14px;
  font-size:18px;display:flex;align-items:center;gap:14px;z-index:3;box-shadow:0 8px 30px rgba(0,0,0,.4)
}
.toast[hidden]{display:none}
#frame{flex:1 1 auto;border:0;width:100%;height:100%;background:#fff;display:none}
#viewer.tool #frame{display:block}
#viewer.tool .stage,#viewer.tool .nav,#viewer.tool .vpage,#viewer.tool .vgroup,#viewer.tool .loading{display:none}
.toast button{background:#3d474d;padding:10px 16px;border-radius:10px;font-weight:700}

@media (max-width:760px){
  .top{padding:24px 16px 14px;flex-direction:column;align-items:flex-start}
  .tabs{padding:0 16px}
  main{padding:20px 16px 48px}
  .grid{grid-template-columns:1fr}
  .vtitle,.hide-sm{display:none}
  .nav{width:52px;height:110px;font-size:46px}
}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>이인승 <span>수업 자료</span></h1>
    <p class="sub" id="today"></p>
  </div>
  <div class="top-right">
    <button class="ghost" id="reloadBtn" type="button">↻ 새로고침</button>
    <time id="clock"></time>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="list"><div class="empty">자료 목록을 불러오는 중…</div></main>

<div id="viewer" hidden>
  <div class="vbar">
    <button class="vbtn" id="vBack" type="button">← 목록</button>
    <div class="vtitle" id="vTitle"></div>
    <div class="vpage">
      <input id="vPage" type="number" inputmode="numeric" min="1" aria-label="쪽 번호">
      <span>/ <span id="vTotal">-</span></span>
    </div>
    <div class="vgroup">
      <button class="vbtn" id="zOut" type="button" aria-label="축소">−</button>
      <button class="vbtn hide-sm" id="zFit" type="button">화면 맞춤</button>
      <button class="vbtn" id="zIn" type="button" aria-label="확대">+</button>
    </div>
    <button class="vbtn primary" id="vFull" type="button">⛶ 전체화면</button>
  </div>
  <div class="vbody">
    <div class="stage" id="stage"><canvas id="canvas"></canvas></div>
    <iframe id="frame" title="수업 도구" allow="fullscreen"></iframe>
    <div class="loading" id="loading">불러오는 중…</div>
    <button class="nav prev" id="prev" type="button" aria-label="이전 쪽">‹</button>
    <button class="nav next" id="next" type="button" aria-label="다음 쪽">›</button>
    <div class="toast" id="toast" hidden></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function(){
  var PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'build/pdf.worker.min.js';

  var $ = function(id){ return document.getElementById(id); };
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  function nfc(s){ return s && s.normalize ? s.normalize('NFC') : s; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }

  // "03_기후와 생활.pdf" -> {num:"03", title:"기후와 생활"}
  function parseName(name){
    var base = nfc(name).replace(/\.pdf$/i,'');
    var m = base.match(/^(\d{1,3})\s*[_\-.)\]]?\s*(.+)$/);
    if (m) return { num:m[1], title:m[2] };
    return { num:'', title:base };
  }
  function folderLabel(name){ return nfc(name).replace(/^\d{1,3}\s*[_\-.)]\s*/,''); }

  /* ---------- 시계 ---------- */
  var DAYS = ['일','월','화','수','목','금','토'];
  function tick(){
    var d = new Date();
    $('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    $('today').textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + DAYS[d.getDay()] + '요일';
  }
  tick(); setInterval(tick, 10000);

  /* ---------- 목록 ---------- */
  var data = null, current = null;

  function load(){
    fetch('files.json?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        data = j;
        var saved = decodeURIComponent((location.hash||'').replace(/^#/,'')) || store.get('lastSubject');
        var names = j.subjects.map(function(s){ return s.name; });
        current = names.indexOf(saved) >= 0 ? saved : names[0];
        drawTabs(); drawList();
      })
      .catch(function(){
        $('list').innerHTML = '<div class="empty">자료 목록을 불러오지 못했어요.<br>인터넷 연결을 확인하고 <b>새로고침</b>을 눌러 주세요.</div>';
      });
  }

  function drawTabs(){
    var html = data.subjects.map(function(s){
      return '<button class="tab" role="tab" type="button" data-s="' + esc(s.name) + '" aria-selected="' + (s.name===current) + '">'
        + esc(folderLabel(s.name)) + '<span class="cnt">' + s.files.length + '</span></button>';
    }).join('');
    $('tabs').innerHTML = data.subjects.length > 0 ? html : '';
  }

  function drawList(){
    var subj = null;
    data.subjects.forEach(function(s){ if (s.name === current) subj = s; });
    if (!subj){
      $('list').innerHTML = '<div class="empty">과목 폴더가 아직 없어요.</div>';
      return;
    }
    if (!subj.files.length){
      $('list').innerHTML = '<div class="empty">아직 올린 자료가 없어요.<br>GitHub의 <b>' + esc(nfc(subj.name)) + '</b> 폴더에 PDF를 올리면 1~2분 뒤 여기에 나타납니다.</div>';
      return;
    }
    var byName = function(a,b){ return nfc(a.name).localeCompare(nfc(b.name), 'ko', {numeric:true}); };
    var tools = subj.files.filter(isTool).sort(byName);
    var files = subj.files.filter(function(f){ return !isTool(f); }).sort(function(a,b){
      var g = nfc(a.group).localeCompare(nfc(b.group), 'ko', {numeric:true});
      return g !== 0 ? g : byName(a,b);
    });
    var now = Date.now(), html = '', lastGroup = null;
    if (tools.length){
      html += '<h2 class="group-title">수업 도구</h2><div class="grid">';
      tools.forEach(function(f){
        var t = parseName(f.name).title.replace(/\.html?$/i,'');
        html += '<button class="card toolcard" type="button" data-kind="tool" data-path="' + esc(f.path) + '">'
          + '<span class="badge tool">' + toolIcon(t) + '</span>'
          + '<span><span class="t">' + esc(t) + '</span></span></button>';
      });
      html += '</div>';
      if (files.length) html += '<h2 class="group-title">수업 자료</h2>';
    }
    files.forEach(function(f){
      if (f.group !== lastGroup){
        if (lastGroup !== null) html += '</div>';
        if (f.group) html += '<h3 class="group-title">' + esc(folderLabel(f.group.split('/').pop())) + '</h3>';
        html += '<div class="grid">';
        lastGroup = f.group;
      }
      var p = parseName(f.name), meta = '';
      if (f.date){
        var d = new Date(f.date);
        meta = (d.getMonth()+1) + '월 ' + d.getDate() + '일 올림';
        if (now - d.getTime() < 7*864e5) meta = '<span class="new">NEW</span>' + meta;
      }
      html += '<button class="card" type="button" data-path="' + esc(f.path) + '">'
        + (p.num ? '<span class="badge">' + esc(p.num) + '</span>' : '<span class="badge doc">PDF</span>')
        + '<span><span class="t">' + esc(p.title) + '</span>'
        + (meta ? '<span class="m">' + meta + '</span>' : '') + '</span></button>';
    });
    if (files.length) html += '</div>';
    $('list').innerHTML = html;
  }

  function isTool(f){ return /\.html?$/i.test(f.name); }
  function toolIcon(t){
    if (/조/.test(t)) return '👥';
    if (/발표|순서|뽑기/.test(t)) return '🎲';
    if (/타이머|시계/.test(t)) return '⏱️';
    return '🧰';
  }

  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    current = b.getAttribute('data-s');
    store.set('lastSubject', current);
    history.replaceState(null, '', '#' + encodeURIComponent(current));
    drawTabs(); drawList();
  });
  $('list').addEventListener('click', function(e){
    var c = e.target.closest('.card'); if (!c) return;
    if (c.getAttribute('data-kind') === 'tool') openTool(c.getAttribute('data-path'));
    else openPdf(c.getAttribute('data-path'));
  });
  $('reloadBtn').addEventListener('click', function(){ location.reload(); });

  /* ---------- 뷰어 ---------- */
  var V = { doc:null, path:null, page:1, total:0, zoom:1, task:null, seq:0 };
  var canvas = $('canvas'), stage = $('stage');
  var ZOOMS = [0.5,0.67,0.8,1,1.25,1.5,2,2.5,3];

  function openPdf(path){
    if (!window.pdfjsLib){ alert('PDF 뷰어를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
    V.path = path; V.page = 1; V.total = 0; V.zoom = 1;
    $('vTitle').textContent = parseName(path.split('/').pop()).title;
    $('vTotal').textContent = '-'; $('vPage').value = '';
    $('loading').textContent = '불러오는 중…'; $('loading').hidden = false;
    canvas.width = 0; canvas.height = 0;
    $('viewer').className = '';
    $('viewer').hidden = false;
    document.body.style.overflow = 'hidden';
    history.pushState({ viewer:true }, '');

    var task = pdfjsLib.getDocument({
      url: encPath(path),
      cMapUrl: PDFJS + 'cmaps/', cMapPacked: true,
      standardFontDataUrl: PDFJS + 'standard_fonts/'
    });
    task.promise.then(function(doc){
      if (V.path !== path) return;
      V.doc = doc; V.total = doc.numPages;
      $('vTotal').textContent = V.total;
      var last = parseInt(store.get('page:' + path), 10);
      if (last > 1 && last <= V.total){
        V.page = last;
        showToast(last + '쪽에서 이어서 열었어요', '처음부터', function(){ go(1); });
      }
      render();
    }).catch(function(){
      $('loading').textContent = '파일을 열지 못했어요. 잠시 후 다시 시도해 주세요.';
    });
  }

  function openTool(path){
    V.path = null; V.tool = path;
    $('vTitle').textContent = parseName(path.split('/').pop()).title.replace(/\.html?$/i,'');
    $('viewer').className = 'tool';
    $('viewer').hidden = false;
    document.body.style.overflow = 'hidden';
    history.pushState({ viewer:true }, '');
    var f = $('frame');
    f.onload = function(){ try { f.contentWindow.focus(); } catch(e){} };
    f.src = encPath(path);
  }

  function closeViewer(fromPop){
    if ($('viewer').hidden) return;
    exitFull();
    $('viewer').hidden = true; hideToast();
    if (V.tool){ $('frame').src = 'about:blank'; V.tool = null; }
    $('viewer').className = '';
    document.body.style.overflow = '';
    if (V.doc){ V.doc.destroy(); V.doc = null; }
    V.path = null;
    if (!fromPop && history.state && history.state.viewer) history.back();
  }
  window.addEventListener('popstate', function(){ closeViewer(true); });

  function render(){
    if (!V.doc) return;
    var seq = ++V.seq, n = V.page;
    if (V.task){ try { V.task.cancel(); } catch(e){} }
    updateUi();
    V.doc.getPage(n).then(function(page){
      if (seq !== V.seq) return;
      var base = page.getViewport({ scale:1 });
      var pad = window.innerWidth > 760 ? 110 : 16;
      var sw = Math.max(100, stage.clientWidth - pad*2), sh = Math.max(100, stage.clientHeight - 16);
      var fit = Math.min(sw / base.width, sh / base.height);
      var css = fit * V.zoom;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var scale = css * dpr;
      var px = base.width * base.height * scale * scale, MAX = 16e6;
      if (px > MAX) scale *= Math.sqrt(MAX / px);
      var vp = page.getViewport({ scale:scale });

      var off = document.createElement('canvas');
      off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
      var ctx = off.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,off.width,off.height);
      V.task = page.render({ canvasContext:ctx, viewport:vp });
      return V.task.promise.then(function(){
        if (seq !== V.seq) return;
        canvas.width = off.width; canvas.height = off.height;
        canvas.getContext('2d').drawImage(off, 0, 0);
        canvas.style.width = Math.floor(base.width * css) + 'px';
        canvas.style.height = Math.floor(base.height * css) + 'px';
        $('loading').hidden = true;
        store.set('page:' + V.path, String(n));
        if (n < V.total) V.doc.getPage(n + 1); // 다음 쪽 미리 준비
      });
    }).catch(function(e){
      if (e && e.name === 'RenderingCancelledException') return;
    });
  }

  function updateUi(){
    $('vPage').value = V.page;
    $('prev').disabled = V.page <= 1;
    $('next').disabled = V.page >= V.total;
    $('zFit').textContent = V.zoom === 1 ? '화면 맞춤' : Math.round(V.zoom*100) + '%';
  }

  function go(n){
    if (!V.doc) return;
    n = Math.max(1, Math.min(V.total, n));
    if (n === V.page) { updateUi(); return; }
    V.page = n; stage.scrollTop = 0; stage.scrollLeft = 0;
    render();
  }
  function zoomStep(dir){
    var i = 0;
    for (var k=0; k<ZOOMS.length; k++) if (Math.abs(ZOOMS[k]-V.zoom) < 0.01) i = k;
    i = Math.max(0, Math.min(ZOOMS.length-1, i + dir));
    if (ZOOMS[i] !== V.zoom){ V.zoom = ZOOMS[i]; render(); }
  }

  $('prev').addEventListener('click', function(){ go(V.page - 1); });
  $('next').addEventListener('click', function(){ go(V.page + 1); });
  $('vBack').addEventListener('click', function(){ closeViewer(false); });
  $('zIn').addEventListener('click', function(){ zoomStep(1); });
  $('zOut').addEventListener('click', function(){ zoomStep(-1); });
  $('zFit').addEventListener('click', function(){ if (V.zoom !== 1){ V.zoom = 1; render(); } });
  $('vPage').addEventListener('change', function(){ go(parseInt(this.value,10) || V.page); this.blur(); });
  $('vPage').addEventListener('focus', function(){ this.select(); });

  /* 전체화면 */
  function isFull(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function exitFull(){
    if (!isFull()) return;
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  $('vFull').addEventListener('click', function(){
    if (isFull()) return exitFull();
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) fn.call(el);
  });
  function onFull(){
    $('vFull').textContent = isFull() ? '전체화면 끄기' : '⛶ 전체화면';
    if (V.tool){ try { $('frame').contentWindow.focus(); } catch(e){} }
    else render();
  }
  document.addEventListener('fullscreenchange', onFull);
  document.addEventListener('webkitfullscreenchange', onFull);

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(render, 150); });

  /* 키보드 · 무선 프레젠터 */
  document.addEventListener('keydown', function(e){
    if ($('viewer').hidden || V.tool || e.target.tagName === 'INPUT') return;
    var k = e.key;
    if (k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'||(k==='ArrowDown'&&V.zoom<=1)){ e.preventDefault(); go(V.page+1); }
    else if (k==='ArrowLeft'||k==='PageUp'||k==='Backspace'||(k==='ArrowUp'&&V.zoom<=1)){ e.preventDefault(); go(V.page-1); }
    else if (k==='Home') go(1);
    else if (k==='End') go(V.total);
    else if (k==='+'||k==='=') zoomStep(1);
    else if (k==='-') zoomStep(-1);
    else if (k==='f'||k==='F') $('vFull').click();
    else if (k==='Escape' && !isFull()) closeViewer(false);
  });

  /* 스와이프 · 휠 */
  var sx=0, sy=0, st=0, multi=false;
  stage.addEventListener('touchstart', function(e){
    multi = e.touches.length > 1;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive:true });
  stage.addEventListener('touchend', function(e){
    if (multi || V.zoom > 1) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st < 700 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(V.page + (dx < 0 ? 1 : -1));
  }, { passive:true });
  var wheelLock = 0;
  stage.addEventListener('wheel', function(e){
    if (V.zoom > 1 || e.ctrlKey) return;
    e.preventDefault();
    var now = Date.now(); if (now < wheelLock || Math.abs(e.deltaY) < 20) return;
    wheelLock = now + 350;
    go(V.page + (e.deltaY > 0 ? 1 : -1));
  }, { passive:false });

  /* 안내 토스트 */
  var toastTimer;
  function showToast(msg, label, fn){
    var t = $('toast');
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (label ? '<button type="button">' + esc(label) + '</button>' : '');
    if (label) t.querySelector('button').onclick = function(){ hideToast(); fn(); };
    t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast(){ $('toast').hidden = true; }

  load();
})();
</script>
</body>
</html>
