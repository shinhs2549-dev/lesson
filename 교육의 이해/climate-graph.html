<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기후 그래프 보조선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Black+Han+Sans&display=swap">
<style>
html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* 레이아웃: 상단 고정 보조선 도구막대 + 원본 학습지처럼 4열 그래프 격자, 그래프를 누르면 크게 보기 */
:root{
  --bg:#f3f6f8; --panel:#ffffff; --ink:#18232c; --muted:#5d6b77; --line:#d5dde3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --chip:#e8eef2;
  --c-p60:#1565d8; --c-p30:#16a3c4;
  --c-t18:#e07b00; --c-t-3:#8a3fc7; --c-t22:#d6263b; --c-t10:#2f9a3c; --c-t0:#0b7f7a; --c-free:#111111;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171d; --panel:#18222a; --ink:#e4ebf0; --muted:#9aa9b5; --line:#2b3a46;
  --accent:#6fb4e2; --accent-ink:#0c1419; --chip:#22303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171d; --panel:#18222a; --ink:#e4ebf0; --muted:#9aa9b5; --line:#2b3a46;
  --accent:#6fb4e2; --accent-ink:#0c1419; --chip:#22303a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.glabel{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-right:2px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px 5px 9px;font-size:.92rem;font-weight:500;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.chip .sw{width:18px;height:0;border-top:3px dashed var(--c);opacity:.45}
.chip .st{font-size:.7rem;color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.chip[aria-pressed="true"] .sw{opacity:1}
.chip:focus-visible,.act:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.act{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;font-size:.88rem}
.act.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.card .head{display:flex;justify-content:space-between;align-items:center}
.num{font-family:var(--f-display);font-size:1.15rem;color:var(--accent)}
.zoom{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:.78rem;color:var(--muted)}
.fig{position:relative;width:100%;line-height:0;cursor:zoom-in;border-radius:4px;overflow:hidden}
.drawing .fig{cursor:crosshair}
.fig img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.answer{border-top:1px dashed var(--line);height:28px}
/* 크게 보기 */
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));gap:10px}
.modal .mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.modal .mnum{font-family:var(--f-display);font-size:1.8rem;color:var(--accent)}
.modal .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:12px}
.modal .stage .fig{height:100%;width:auto;aspect-ratio:var(--ar);max-width:calc(100% - 120px);cursor:default}
.drawing .modal .stage .fig{cursor:crosshair}
.modal .stage .fig img{height:100%;width:100%}
.nav{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-size:1.4rem;line-height:1}
@media (max-width:620px){.modal .stage .fig{max-width:calc(100% - 92px)}.nav{width:38px;height:38px}}
.mtools{max-width:1200px;width:100%;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="bar">
  <div class="wrap">
    <div class="titlerow">
      <h1>기후 그래프 보조선</h1>
      <p class="hint">보조선을 켜면 14개 그래프에 한꺼번에 그어집니다. 그래프를 누르면 크게 볼 수 있어요.</p>
    </div>
    <div class="tools" id="tools"></div>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal" hidden>
  <div class="mtools"><div class="tools" id="tools2"></div></div>
  <div class="mtop mtools">
    <span class="mnum" id="mnum"></span>
    <button class="act" id="mclose" type="button">닫기 (Esc)</button>
  </div>
  <div class="stage">
    <button class="nav" id="prev" type="button" aria-label="이전 그래프">‹</button>
    <div id="mfig"></div>
    <button class="nav" id="next" type="button" aria-label="다음 그래프">›</button>
  </div>
</div>

// 보조선 정의 — 학습지 '기후 그래프 읽는 법' 단계 번호와 같음
const LINES = [
  {id:'p60', kind:'p', v:60,  label:'60mm',  steps:'1·4·7·8', c:'--c-p60'},
  {id:'p30', kind:'p', v:30,  label:'30mm',  steps:'2·12',    c:'--c-p30'},
  {id:'t18', kind:'t', v:18,  label:'18℃',   steps:'3',       c:'--c-t18'},
  {id:'t-3', kind:'t', v:-3,  label:'−3℃',   steps:'5',       c:'--c-t-3'},
  {id:'t22', kind:'t', v:22,  label:'22℃',   steps:'9',       c:'--c-t22'},
  {id:'t10', kind:'t', v:10,  label:'10℃',   steps:'10',      c:'--c-t10'},
  {id:'t0',  kind:'t', v:0,   label:'0℃',    steps:'11',      c:'--c-t0'},
];
const on = new Set();
const free = GRAPHS.map(()=>[]);   // 직접 그은 선 (이미지 y좌표)
let drawing = false, current = -1;
const NS='http://www.w3.org/2000/svg';

function yOf(g, kind, v){
  const span = g.bot - g.top;
  return kind==='p' ? g.bot - v/500*span : g.bot - (v-(g.tmax-50))/50*span;
}
function valuesAt(g, y){
  const span=g.bot-g.top, r=(g.bot-y)/span;
  return {t: (g.tmax-50)+r*50, p: r*500};
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

function tag(svg, name, attrs, text){
  const e=document.createElementNS(NS,name);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(text!=null) e.textContent=text;
  svg.appendChild(e); return e;
}
function label(svg, x, y, txt, color, anchor, big){
  const fs = big?8:9.5, w = txt.length*fs*0.62+6, h=fs+4;
  const rx = anchor==='end'? x-w : x;
  tag(svg,'rect',{x:rx,y:y-h/2,width:w,height:h,rx:2,fill:color});
  tag(svg,'text',{x:rx+w/2,y:y+fs*0.36,'text-anchor':'middle','font-size':fs,'font-weight':700,fill:'#fff','font-family':'IBM Plex Sans KR, sans-serif'},txt);
}
function drawSVG(svg, i, big){
  const g=GRAPHS[i];
  svg.innerHTML='';
  const cid='clip'+i+(big?'b':'');
  const defs=tag(svg,'defs',{});
  const cp=document.createElementNS(NS,'clipPath'); cp.id=cid;
  const r=document.createElementNS(NS,'rect');
  r.setAttribute('x',g.x0); r.setAttribute('y',g.top-1); r.setAttribute('width',g.x1-g.x0); r.setAttribute('height',g.bot-g.top+2);
  cp.appendChild(r); defs.appendChild(cp);
  const layer=tag(svg,'g',{'clip-path':`url(#${cid})`});
  const labels=[];
  for(const L of LINES){
    if(!on.has(L.id)) continue;
    const y=yOf(g,L.kind,L.v);
    if(y<g.top-0.5||y>g.bot+0.5) continue;  // 이 그래프 눈금 범위 밖
    const col=css(L.c);
    tag(layer,'line',{x1:g.x0,x2:g.x1,y1:y,y2:y,stroke:col,'stroke-width':big?2.5:2.2,'stroke-dasharray':'6 4','vector-effect':'non-scaling-stroke'});
    labels.push({y,txt:L.label,col,side:L.kind==='p'?'r':'l'});
  }
  free[i].forEach(y=>{
    const col=css('--c-free'), v=valuesAt(g,y);
    tag(layer,'line',{x1:g.x0,x2:g.x1,y1:y,y2:y,stroke:col,'stroke-width':big?2:1.8,'vector-effect':'non-scaling-stroke'});
    labels.push({y,txt:`${v.t.toFixed(0)}℃ · ${Math.max(0,v.p).toFixed(0)}mm`,col,side:'c'});
  });
  for(const lb of labels){
    if(lb.side==='r') label(svg,g.x1-2,lb.y,lb.txt,lb.col,'end',big);
    else if(lb.side==='l') label(svg,g.x0+2,lb.y,lb.txt,lb.col,'start',big);
    else label(svg,(g.x0+g.x1)/2-24,lb.y,lb.txt,lb.col,'start',big);
  }
}

function makeFig(i, big){
  const g=GRAPHS[i];
  const fig=document.createElement('div'); fig.className='fig';
  fig.style.setProperty('--ar', `${g.w}/${g.h}`);
  const img=new Image(); img.src=g.src; img.alt=`${i+1}번 기후 그래프`; img.draggable=false;
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${g.w} ${g.h}`); svg.setAttribute('preserveAspectRatio','none');
  fig.append(img,svg);
  fig.addEventListener('click',e=>{
    if(drawing){
      const rect=fig.getBoundingClientRect();
      const y=(e.clientY-rect.top)/rect.height*g.h;
      if(y<g.top||y>g.bot) return;
      // 가까운 선을 다시 누르면 지우기
      const hit=free[i].findIndex(fy=>Math.abs(fy-y)<5);
      if(hit>=0) free[i].splice(hit,1); else free[i].push(y);
      refresh();
    } else if(!big) openModal(i);
  });
  return {fig,svg};
}

const cards=[];
function buildGrid(){
  const grid=document.getElementById('grid');
  GRAPHS.forEach((g,i)=>{
    const card=document.createElement('div'); card.className='card';
    const head=document.createElement('div'); head.className='head';
    head.innerHTML=`<span class="num">${i+1}</span>`;
    const z=document.createElement('button'); z.className='zoom'; z.type='button'; z.textContent='크게 보기';
    z.addEventListener('click',()=>openModal(i));
    head.appendChild(z);
    const {fig,svg}=makeFig(i,false);
    const ans=document.createElement('div'); ans.className='answer';
    card.append(head,fig,ans); grid.appendChild(card);
    cards.push(svg);
  });
}

function buildTools(host){
  host.innerHTML='';
  const mk=(name,ids)=>{
    const grp=document.createElement('div'); grp.className='group';
    grp.innerHTML=`<span class="glabel">${name}</span>`;
    for(const L of LINES.filter(l=>ids.includes(l.kind))){
      const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.id=L.id;
      b.style.setProperty('--c',`var(${L.c})`);
      b.innerHTML=`<span class="sw"></span>${L.label}<span class="st">${L.steps}단계</span>`;
      b.addEventListener('click',()=>{on.has(L.id)?on.delete(L.id):on.add(L.id);refresh()});
      grp.appendChild(b);
    }
    host.appendChild(grp);
  };
  mk('강수량','p'); mk('기온','t');
  const grp=document.createElement('div'); grp.className='group';
  const all=document.createElement('button'); all.type='button'; all.className='act'; all.dataset.role='all';
  all.addEventListener('click',()=>{ if(on.size===LINES.length) on.clear(); else LINES.forEach(l=>on.add(l.id)); refresh(); });
  const pen=document.createElement('button'); pen.type='button'; pen.className='act'; pen.dataset.role='pen'; pen.textContent='직접 긋기';
  pen.addEventListener('click',()=>{drawing=!drawing;refresh()});
  const clr=document.createElement('button'); clr.type='button'; clr.className='act'; clr.dataset.role='clr'; clr.textContent='그은 선 지우기';
  clr.addEventListener('click',()=>{free.forEach(a=>a.length=0);refresh()});
  grp.append(all,pen,clr); host.appendChild(grp);
}

let mSvg=null;
function openModal(i){
  current=i;
  const host=document.getElementById('mfig'); host.innerHTML='';
  const {fig,svg}=makeFig(i,true); host.replaceWith(fig); fig.id='mfig'; mSvg=svg;
  document.getElementById('mnum').textContent=`${i+1}번 그래프`;
  document.getElementById('modal').hidden=false;
  refresh();
}
function closeModal(){document.getElementById('modal').hidden=true;current=-1;mSvg=null}
function step(d){ if(current<0) return; openModal((current+d+GRAPHS.length)%GRAPHS.length) }

function refresh(){
  document.body.classList.toggle('drawing',drawing);
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',on.has(b.dataset.id)));
  document.querySelectorAll('[data-role=all]').forEach(b=>b.textContent= on.size===LINES.length?'모두 끄기':'모두 켜기');
  document.querySelectorAll('[data-role=pen]').forEach(b=>{b.classList.toggle('on',drawing);b.setAttribute('aria-pressed',drawing)});
  const nFree=free.reduce((s,a)=>s+a.length,0);
  document.querySelectorAll('[data-role=clr]').forEach(b=>b.disabled=nFree===0);
  cards.forEach((svg,i)=>drawSVG(svg,i,false));
  if(mSvg) drawSVG(mSvg,current,true);
}

buildGrid();
buildTools(document.getElementById('tools'));
buildTools(document.getElementById('tools2'));
document.getElementById('mclose').addEventListener('click',closeModal);
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{
  if(current<0) return;
  if(e.key==='Escape') closeModal();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',refresh);
refresh();
</script>
